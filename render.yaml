databases:
  - name: comicverse-db
    databaseName: comicverse
    user: comicverse_user
    plan: free

services:
  # 1. NestJS API
  - type: web
    name: comicverse-api
    runtime: node
    rootDir: apps/api
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run db:seed && npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: comicverse-db
          property: connectionString
      - key: WEB_ORIGIN          # e.g. https://comicverse-web.onrender.com (must be https, no trailing slash)
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: MAIL_PROVIDER     # required in production, e.g. resend
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

  # 2. Next.js web
  - type: web
    name: comicverse-web
    runtime: node
    rootDir: apps/web
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL   # e.g. https://comicverse-api.onrender.com/api  (set BEFORE building)
        sync: false
