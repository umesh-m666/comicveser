name: CI
on: [push, pull_request]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: comicverse, POSTGRES_PASSWORD: comicverse, POSTGRES_DB: comicverse_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U comicverse" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://comicverse:comicverse@localhost:5432/comicverse_test?schema=public
      WEB_ORIGIN: http://localhost:3000
      DISABLE_JOBS: "true"
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx prisma generate
      - run: npm run build          # type-checks and compiles
      - run: npm test               # unit tests
      - run: npx prisma migrate deploy
      - run: npm run test:e2e       # API integration tests against the test database
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
        env: { NEXT_PUBLIC_API_URL: "http://localhost:4000/api" }
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  browser:
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: comicverse, POSTGRES_PASSWORD: comicverse, POSTGRES_DB: comicverse_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U comicverse" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://comicverse:comicverse@localhost:5432/comicverse_test?schema=public
      WEB_ORIGIN: http://localhost:3000
      CDN_BASE_URL: http://e2e.invalid
      DISABLE_JOBS: "true"
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Start API with test data
        working-directory: apps/api
        run: |
          npm install && npx prisma generate && npx prisma migrate deploy && npx tsx prisma/seed-e2e.ts && npm run build
          node dist/main.js &
          for i in $(seq 1 30); do curl -fs http://localhost:4000/api/health && break || sleep 2; done
      - name: Build and start web
        working-directory: apps/web
        run: npm install && npm run build && (npm run start &) && sleep 5
      - name: Browser tests
        working-directory: apps/web
        env: { CI: "1", E2E_NO_SERVER: "1" }
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: apps/web/test-results }

  # Deploy hooks (add the URLs as repository secrets, then uncomment):
